<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accounts Management — GoPick</title>
  <link rel="stylesheet" href="../../../shared/css/site-shell.css?v=20260429-gradient">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#e50914', light: '#ff2d38', dark: '#b3060f' }
          }
        }
      }
    }
  </script>
</head>
<body class="manual-page bg-slate-50 text-slate-800 antialiased">

  <!-- ==================== Header ==================== -->
  <header class="manual-header fixed top-0 inset-x-0 z-[100] bg-white/95 backdrop-blur border-b border-slate-100" role="banner">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="../../../index.html" class="inline-flex items-center" aria-label="GoPick home">
        <img src="../../../shared/img/gopick-logo.svg" alt="GoPick Solutions" class="h-10 w-auto">
      </a>
      <nav aria-label="Main navigation">
        <ul class="flex items-center gap-6 text-sm font-medium text-slate-600">
          <li><a class="hover:text-brand transition-colors" href="../../../index.html">Home</a></li>
          <li><a class="text-brand font-semibold" href="#" aria-current="page">Accounts</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="manual-main pt-20 pb-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">

      <!-- ==================== Page Hero ==================== -->
      <div class="manual-page-hero mb-10">
        <span class="manual-page-hero__eyebrow">Manual Page</span>
        <h1 id="accountsPageTitle" class="text-3xl md:text-4xl font-extrabold text-slate-900">Accounts</h1>
        <p id="accountsPageDescription" class="mt-3 text-lg text-slate-500 max-w-3xl">Provides Access Control and Management of Accounts of GoPick.</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">

        <!-- ==================== Sidebar ==================== -->
        <aside class="hidden lg:block lg:col-span-1">
          <nav class="manual-sidebar-panel sticky top-24 p-5">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">On this page</h4>
            <ul id="docSidebarList" class="space-y-2 text-sm"></ul>
          </nav>
        </aside>

        <!-- ==================== Content ==================== -->
        <div class="lg:col-span-4 space-y-8">

          <!-- Create Account -->
          <section id="create-account" class="bg-white rounded-xl border border-slate-100 p-6 shadow-sm">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Create Account</h2>
            <div id="createAccountSections" class="grid gap-4 grid-cols-1"></div>
          </section>

          <!-- View Accounts -->
          <section id="view-accounts" class="bg-white rounded-xl border border-slate-100 p-6 shadow-sm">
            <h2 class="text-xl font-bold text-slate-900 mb-4">View Accounts</h2>
            <div id="viewAccountsContent" class="grid gap-4 grid-cols-1"></div>
          </section>

          <!-- Other Functions -->
          <section id="other-functions" class="bg-white rounded-xl border border-slate-100 p-6 shadow-sm">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Other Functions</h2>
            <div id="updateSpecificContent" class="grid gap-4 grid-cols-1 mb-4"></div>
            <div id="functionSections" class="grid gap-4 grid-cols-1"></div>

            <!-- Search -->
            <section id="search" class="mt-4 rounded-lg border border-slate-100 bg-slate-50 p-5">
              <h3 class="font-semibold text-slate-900 mb-2">Search</h3>
              <div id="searchContent"></div>
            </section>

            <!-- Advance Search -->
            <section id="advance-search" class="mt-4 rounded-lg border border-slate-100 bg-slate-50 p-5">
              <h3 class="font-semibold text-slate-900 mb-2">Advance Search</h3>
              <div id="advance-searchContent"></div>
            </section>

            <!-- Row Actions -->
            <section id="row-actions" class="mt-4 rounded-lg border border-slate-100 bg-slate-50 p-5">
              <h3 class="font-semibold text-slate-900 mb-2">Row Actions</h3>
              <div id="rowActionsContent" class="grid gap-4 grid-cols-1"></div>
            </section>

            <!-- Bulk Action -->
            <section id="bulk-action" class="mt-4 rounded-lg border border-slate-100 bg-slate-50 p-5">
              <h3 class="font-semibold text-slate-900 mb-2">Bulk Action</h3>
              <div id="bulkActionContent" class="grid gap-4 grid-cols-1"></div>
            </section>
          </section>

        </div>
      </div>
    </div>
  </main>

  <!-- ==================== Footer ==================== -->
  <footer class="manual-footer py-6">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 text-center">
      <div class="text-center">
        <p class="text-slate-400 text-sm">&copy; <span id="footerYearSpan"></span> GoPick — Assessment Center</p>
        <p class="mt-2 text-xs"><a class="text-slate-400 hover:text-brand transition-colors" href="../../../pages/dev-rules/index.html">Dev Rules</a></p>
      </div>
    </div>
  </footer>

  <script src="assets/js/dataFiller.js" defer></script>
  <script src="assets/js/behavior.js" defer></script>
  <script src="../../../shared/js/headerSearch.js" defer></script>
  <script src="../../../shared/js/manualNav.js" defer></script>
</body>
</html>
